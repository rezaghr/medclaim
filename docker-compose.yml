services:
  api:
    build: .
    command: ["uvicorn", "medclaim.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MEDCLAIM_CONFIG: /app/configs/deployment/default.yaml
      MEDCLAIM_STRICT_STARTUP: "true"
      MEDCLAIM_ENV: ${MEDCLAIM_ENV:-development}
      LLM_MODEL: ${LLM_MODEL:-dolphin-llama3:8b}
      OLLAMA_BASE_URL: ${MEDCLAIM_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      MEDCLAIM_CORPUS_DIR: /app/artifacts/corpora/bootstrap-corpus-v1
      MEDCLAIM_BM25_INDEX_DIR: /app/artifacts/indexes/bootstrap-bm25-v1
      MEDCLAIM_DENSE_INDEX_DIR: /app/artifacts/indexes/bootstrap-dense-v1
      MEDCLAIM_EMBEDDING_PROVIDER: ${MEDCLAIM_EMBEDDING_PROVIDER:-ollama}
      MEDCLAIM_EMBEDDING_MODEL: ${MEDCLAIM_EMBEDDING_MODEL:-nomic-embed-text:latest}
      MEDCLAIM_EMBEDDING_QUERY_PREFIX: "search_query: "
      MEDCLAIM_RERANKER_PROVIDER: ${MEDCLAIM_RERANKER_PROVIDER:-ollama}
      MEDCLAIM_RERANKER_MODEL: ${MEDCLAIM_RERANKER_MODEL:-dolphin-llama3:8b}
      MEDCLAIM_RERANKER_BATCH_SIZE: ${MEDCLAIM_RERANKER_BATCH_SIZE:-1}
      MEDCLAIM_RETRIEVAL_MODE: ${MEDCLAIM_RETRIEVAL_MODE:-hybrid_reranked}
      MEDCLAIM_RETRIEVAL_CANDIDATE_COUNT: ${MEDCLAIM_RETRIEVAL_CANDIDATE_COUNT:-30}
      MEDCLAIM_TOP_K: ${MEDCLAIM_TOP_K:-5}
      MEDCLAIM_GATE_MINIMUM_SCORE: ${MEDCLAIM_GATE_MINIMUM_SCORE:-0.75}
    ports: ["8000:8000"]
    depends_on:
      artifacts-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - medclaim-artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 3s
      retries: 5

  streamlit:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      MEDCLAIM_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports: ["8501:8501"]
    read_only: true
    tmpfs: [/tmp, /home/medclaim/.streamlit]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  artifacts-init:
    build: .
    user: "0:0"
    command:
      - python
      - scripts/bootstrap_runtime_artifacts.py
      - --artifact-root
      - /app/artifacts
      - --embedding-model
      - ${MEDCLAIM_EMBEDDING_MODEL:-nomic-embed-text:latest}
      - --ollama-base-url
      - ${MEDCLAIM_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - medclaim-artifacts:/app/artifacts
    restart: "no"

volumes:
  medclaim-artifacts:
