services:
  api:
    build: .
    command: ["uvicorn", "medclaim.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MEDCLAIM_CONFIG: /app/configs/deployment/default.yaml
      MEDCLAIM_STRICT_STARTUP: "true"
      MEDCLAIM_ENV: ${MEDCLAIM_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-dolphin-llama3:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_API_KEY: ${LLM_API_KEY:-}
      MEDCLAIM_CORPUS_DIR: /app/artifacts/corpora/medical-corpus-v2
      MEDCLAIM_BM25_INDEX_DIR: /app/artifacts/indexes/medical-bm25-v2
      MEDCLAIM_DENSE_INDEX_DIR: /app/artifacts/indexes/medical-dense-v2
      MEDCLAIM_EMBEDDING_PROVIDER: ${MEDCLAIM_EMBEDDING_PROVIDER:-ollama}
      MEDCLAIM_EMBEDDING_MODEL: ${MEDCLAIM_EMBEDDING_MODEL:-nomic-embed-text:latest}
      MEDCLAIM_EMBEDDING_QUERY_PREFIX: "search_query: "
      MEDCLAIM_RERANKER_PROVIDER: ${MEDCLAIM_RERANKER_PROVIDER:-ollama}
      MEDCLAIM_RERANKER_MODEL: ${MEDCLAIM_RERANKER_MODEL:-dolphin-llama3:8b}
      MEDCLAIM_RERANKER_BATCH_SIZE: ${MEDCLAIM_RERANKER_BATCH_SIZE:-1}
      MEDCLAIM_RETRIEVAL_MODE: ${MEDCLAIM_RETRIEVAL_MODE:-hybrid_reranked}
      MEDCLAIM_RETRIEVAL_CANDIDATE_COUNT: ${MEDCLAIM_RETRIEVAL_CANDIDATE_COUNT:-30}
      MEDCLAIM_TOP_K: ${MEDCLAIM_TOP_K:-5}
      MEDCLAIM_GATE_MINIMUM_SCORE: ${MEDCLAIM_GATE_MINIMUM_SCORE:-0.75}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-false}
      PERSIST_CLAIM_TEXT: ${PERSIST_CLAIM_TEXT:-false}
      PERSIST_EXPLANATION: ${PERSIST_EXPLANATION:-false}
      DATABASE_URL: ${DATABASE_URL:-}
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./artifacts/corpora:/app/artifacts/corpora:ro
      - ./artifacts/indexes:/app/artifacts/indexes:ro
      - ./artifacts/models:/app/artifacts/models:ro
      - ./configs:/app/configs:ro
      - ./artifacts/experiments:/app/artifacts/experiments
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  streamlit:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      MEDCLAIM_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports: ["8501:8501"]
    read_only: true
    tmpfs: [/tmp, /home/medclaim/.streamlit]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    profiles: ["tools"]
    entrypoint: []
    command: ["python", "scripts/audit_spec_alignment.py", "--repository-root", ".", "--strict"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs:ro
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-alpine
    profiles: ["persistence"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medclaim}
      POSTGRES_USER: ${POSTGRES_USER:-medclaim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["11434:11434"]

volumes:
  postgres-data:
  ollama-data:
