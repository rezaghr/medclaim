name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LLM_PROVIDER: fake
  LLM_MODEL: fake-verifier-v1
  PERSISTENCE_ENABLED: "false"
  PERSIST_CLAIM_TEXT: "false"
  PERSIST_EXPLANATION: "false"

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Formatting validation
        run: >-
          ruff format --check
          src/medclaim/api src/medclaim/audit src/medclaim/observability
          src/medclaim/runtime src/medclaim/safety src/medclaim/security
          app scripts/audit_spec_alignment.py scripts/profile_demo_pipeline.py
          tests/contracts tests/safety/test_medical_scope_router.py
          tests/safety/test_prompt_injection_hardening.py
          tests/safety/test_service_safety_boundary.py
      - name: Ruff linting
        run: ruff check src app scripts tests
      - name: Static type checking
        run: mypy src/medclaim/safety src/medclaim/security src/medclaim/runtime src/medclaim/api
      - name: Specification alignment gate
        run: python scripts/audit_spec_alignment.py --repository-root . --strict
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Safety tests
        run: pytest -q tests/safety
      - name: Integration tests with fake providers
        run: pytest -q tests/integration
      - name: API contracts
        run: pytest -q tests/contracts
      - name: Evaluation regression and artifact compatibility
        run: >-
          pytest -q
          tests/integration/test_bm25_evaluation_pipeline.py
          tests/integration/test_small_experiment_matrix.py
          tests/unit/test_unified_dataset.py
          tests/unit/test_readiness.py
      - name: Demo performance smoke profile
        run: python scripts/profile_demo_pipeline.py --runs 5 --warmups 1
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Diff hygiene
        run: git diff --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build non-root application image
        run: docker build -t medclaim-ci .
      - name: Compose liveness smoke test
        run: |
          docker compose up -d api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/live; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
